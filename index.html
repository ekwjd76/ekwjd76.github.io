<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 문화 기록 & 일기장</title>
  <style>
    :root {
      --bg-beige: #f8f5f1;
      --accent-lavender: #b9a0ff;
      --text-main: #4a4a4a;
      --white-card: #ffffff;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 0;
      background: var(--bg-beige);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      border-bottom: 2px solid #e0d9ff;
      background: linear-gradient(to right, #d8c9ff, #b9a0ff);
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1em;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    main {
      display: flex;
      flex: 1;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      gap: 40px;
      box-sizing: border-box;
    }

    section {
      flex: 1;
      max-width: 600px;
      background: var(--white-card);
      border-radius: 20px;
      padding: 25px 30px;
      box-shadow:
        8px 8px 18px rgba(0, 0, 0, 0.08),
        -4px -4px 12px rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      height: 600px;
    }

    section:hover {
      transform: translateY(-3px);
      box-shadow:
        10px 10px 20px rgba(0, 0, 0, 0.1),
        -4px -4px 12px rgba(255, 255, 255, 0.7);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 15px;
      text-align: center;
      font-size: 1.3em;
      font-weight: 700;
      color: var(--accent-lavender);
      cursor: pointer;
      transition: color 0.2s;
    }

    h2:hover {
      color: #9376ff;
    }

    /* 감상 기록 카드 */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .review-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .review-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    }

    .review-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .review-card-title {
      padding: 6px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85em;
      color: var(--text-main);
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 1em;
      resize: none;
      background: #fffdf9;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.05);
      flex: 1;
    }

    button {
      background-color: var(--accent-lavender);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background-color: #a187ff;
    }

    footer {
      text-align: center;
      padding: 12px;
      border-top: 2px solid #e0d9ff;
      background: #eee;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header id="site-header" style="border-bottom:2px solid #e0d9ff;background:linear-gradient(to right,#d8c9ff,#b9a0ff);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;">
  <div style="display:flex;flex-direction:column;gap:4px;">
    <div id="date" style="font-weight:700;"></div>
    <div id="location" style="font-size:0.9em;opacity:0.92;">서울특별시</div>
  </div>

  <div id="weather" style="display:flex;align-items:center;gap:10px;">
    <div id="weather-icon" style="font-size:24px;line-height:1;">☁️</div>
    <div style="text-align:right;">
      <div id="weather-desc" style="font-weight:700;">날씨 불러오는 중...</div>
      <div id="weather-temp" style="font-size:0.9em;opacity:0.95;"></div>
    </div>
  </div>
</header>

  <main>
    <section id="review-section">
      <h2 id="goToReview">🎬 감상 기록 남기기</h2>
      <div id="reviewList" class="card-container"></div>
    </section>

    <section id="diary-section">
      <h2>📓 나의 일기</h2>
      <textarea id="diaryText" rows="14" placeholder="오늘의 일기를 적어보세요..."></textarea>
      <button id="saveDiary">💾 저장</button>
    </section>
  </main>

  <footer>© 2025 나의 문화 기록 웹</footer>

  <script>
    // 날짜 표시
    const today = new Date();
    document.getElementById("date").textContent = today.toLocaleDateString('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });

    const weatherBox = document.getElementById("weather");
   if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric&lang=kr`)
        .then(res => res.json())
        .then(data => weatherBox.textContent = `${data.weather[0].description} / ${data.main.temp.toFixed(1)}°C`);
    });
   }

    // 감상기록 목록 표시
    const reviewList = document.getElementById("reviewList");
    const reviews = JSON.parse(localStorage.getItem("reviews") || "[]");

    reviewList.innerHTML = reviews.map((r, i) => `
      <div class="review-card" data-id="${i}">
        ${r.poster ? `<img src="${r.poster}" alt="${r.title}">` : `<div style="height:200px; background:#ddd;"></div>`}
        <div class="review-card-title">${r.title}</div>
      </div>
    `).join("");

    reviewList.addEventListener("click", e => {
      const card = e.target.closest(".review-card");
      if (card) {
        localStorage.setItem("currentReview", card.dataset.id);
        window.location.href = "review.html";
      }
    });

    // 일기 저장
    const diaryKey = `diary-${today.toISOString().split("T")[0]}`;
    const diaryText = document.getElementById("diaryText");
    document.getElementById("saveDiary").addEventListener("click", () => {
      localStorage.setItem(diaryKey, diaryText.value);
      alert("일기가 저장되었습니다!");
    });
    const saved = localStorage.getItem(diaryKey);
    if (saved) diaryText.value = saved;

    // 감상기록 작성 페이지 이동
    document.getElementById("goToReview").addEventListener("click", () => {
      window.location.href = "review.html";
    });

    (async function(){
  // --- 날짜 (요일 길게: "월요일") ---
  const today = new Date();
  document.getElementById("date").textContent = today.toLocaleDateString('ko-KR', {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    weekday: 'long'
  });

  // --- 서울 고정 좌표 (위도, 경도) ---
  const lat = 37.5665;
  const lon = 126.9780;

  // --- Open-Meteo 현재날씨 API (키 불필요, CORS 허용) ---
  const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=Asia/Seoul`;

  // 날씨코드 → (아이콘, 한글설명) 매핑
  const weatherMap = {
    0:  {icon:'☀️',  desc:'맑음'},
    1:  {icon:'🌤️', desc:'주로 맑음'},
    2:  {icon:'⛅',  desc:'부분적으로 흐림'},
    3:  {icon:'☁️',  desc:'흐림'},
    45: {icon:'🌫️', desc:'안개'},
    48: {icon:'🌫️', desc:'서리 안개'},
    51: {icon:'🌦️', desc:'약한 이슬비'},
    53: {icon:'🌦️', desc:'보통 이슬비'},
    55: {icon:'🌧️', desc:'강한 이슬비'},
    56: {icon:'🌧️', desc:'약한 얼음비'},
    57: {icon:'🌧️', desc:'강한 얼음비'},
    61: {icon:'🌧️', desc:'약한 비'},
    63: {icon:'🌧️', desc:'보통 비'},
    65: {icon:'🌧️', desc:'강한 비'},
    66: {icon:'🌨️', desc:'약한 진눈깨비'},
    67: {icon:'🌨️', desc:'강한 진눈깨비'},
    71: {icon:'🌨️', desc:'약한 눈'},
    73: {icon:'🌨️', desc:'보통 눈'},
    75: {icon:'❄️',  desc:'강한 눈'},
    77: {icon:'❄️',  desc:'눈알(눈 입자)'},
    80: {icon:'🌧️', desc:'약한 소나기'},
    81: {icon:'🌧️', desc:'소나기'},
    82: {icon:'⛈️', desc:'강한 소나기'},
    85: {icon:'🌨️', desc:'약한 눈 소나기'},
    86: {icon:'❄️',  desc:'강한 눈 소나기'},
    95: {icon:'⛈️', desc:'뇌우(천둥번개)'},
    96: {icon:'⛈️', desc:'우박을 동반한 뇌우'},
    99: {icon:'⛈️', desc:'강한 우박을 동반한 뇌우'}
  };

  const weatherIconEl = document.getElementById("weather-icon");
  const weatherDescEl = document.getElementById("weather-desc");
  const weatherTempEl = document.getElementById("weather-temp");

  // 로딩 표시
  weatherDescEl.textContent = "날씨 불러오는 중...";

  try {
    const res = await fetch(apiUrl, { cache: "no-cache" });
    if (!res.ok) throw new Error('응답오류: ' + res.status);
    const data = await res.json();

    if (!data.current_weather) {
      weatherDescEl.textContent = "날씨 데이터를 받을 수 없습니다.";
      weatherTempEl.textContent = "";
      return;
    }

    const code = data.current_weather.weathercode;
    const temp = data.current_weather.temperature; // 섭씨
    const wind = data.current_weather.windspeed;

    const info = weatherMap.hasOwnProperty(code) ? weatherMap[code] : {icon:'❔', desc:'알 수 없음'};

    weatherIconEl.textContent = info.icon;
    weatherDescEl.textContent = `${info.desc} · 바람 ${Math.round(wind)}km/h`;
    weatherTempEl.textContent = `${temp.toFixed(1)}°C`;
  } catch (err) {
    console.error(err);
    weatherDescEl.textContent = "날씨 정보를 불러올 수 없습니다.";
    weatherTempEl.textContent = "";
  }
 })();
  </script>
</body>
</html>
