<!DOCTYPE html>
<html lang="ko">
<header id="site-header">
  <div class="header-date-location">
    <div id="date"></div>
  </div>

  <div id="weather">
    <div class="header-weather-info">
      <div id="weather-desc">☁️날씨 불러오는 중...</div>
    </div>
  </div>
</header>
<body>

<header>
  <h2>📓 일기 작성</h2>
</header>

<!-- layout -->
<div id="diary-layout">

  <!-- LEFT : Write Form -->
  <section id="write-area">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>새 일기</h3>
      <div style="display:flex;gap:8px;">
        <button id="saveBtnTop">💾 저장</button>
        <button id="clearBtn">초기화</button>
      </div>
    </div>

    <div id="metaRow" style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
      <div id="diary-date" style="font-weight:700;color:#333">선택한 날짜 없음</div>
      <div id="weather-fixed" style="text-align:right;color:#666">☀️ 맑음</div>
    </div>

    <input id="diary-title" placeholder="제목" style="padding:8px;border-radius:8px;border:1px solid #ccc;margin-top:10px;">
    <!-- support URL or file -->
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input id="diary-img" placeholder="이미지 URL (선택)" style="flex:1;padding:8px;border-radius:8px;border:1px solid #ccc;">
      <label style="padding:8px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;">
        파일
        <input id="diary-image-file" type="file" accept="image/*" style="display:none">
      </label>
    </div>

    <textarea id="diaryText" placeholder="일기 내용을 입력하세요 (선택)" style="margin-top:10px;"></textarea>
  </section>

  <!-- RIGHT : Calendar & Daily List -->
  <section id="calendar-area">
   <h3 style="text-align:center">📅 달력</h3>
   <div id="monthLabel" style="text-align:center;font-weight:700;margin-bottom:6px"></div>

   <div style="display:flex;justify-content:center;gap:10px;margin-bottom:6px;">
    <button onclick="prevMonth()">◀</button>
    <button onclick="nextMonth()">▶</button>
   </div>

   <div id="calendar-wrapper">
    <div id="weekdays">
     <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div id="calendar"></div>
   </div>

   <h4 style="margin-top:12px;">📌 해당 날짜 일기</h4>
   <div id="selected-day-list"></div>

  </section>

</div>

<!-- BOTTOM SEARCH + FOLDER + LIST -->
<section id="controls">
  <input id="searchInput" placeholder="검색 : YYYY-MM-DD / 제목 / 내용" />

  <div id="folder-row">
    <input id="folderName" placeholder="폴더 이름">
    <button id="addFolderBtn">＋</button>

    <div style="margin-left:auto;display:flex;gap:8px;">
      <button id="allToggle" class="toggle-btn active">전체보기</button>
      <button id="folderToggle" class="toggle-btn">폴더보기</button>
    </div>
  </div>

  <div id="diary-flat-list"></div>
  <div id="folderList" style="display:none"></div>
</section>

<!-- Modal: 상세보기 + 수정/삭제 -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalDate" class="modal-date"></div>
    <div id="modalWeather" class="modal-weather"></div>
    <img id="modalImage" class="modal-image" src="" style="display:none" />
    <h3 id="modalTitle"></h3>
    <p id="modalContent"></p>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
      <div id="modalFolder"></div>
      <div style="display:flex;gap:8px;">
        <button id="modalEditBtn">수정</button>
        <button id="modalDeleteBtn">삭제</button>
      </div>
    </div>
  </div>
</div>

<footer>
  © 2025 나의 문화 기록 웹
</footer>

<script>
   // 날짜 + 날씨
  const today = new Date();
  document.getElementById("date").textContent = today.toLocaleDateString('ko-KR', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  });

  const weatherBox = document.getElementById("weather");
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric&lang=kr`)
        .then(res => res.json())
        .then(data => weatherBox.textContent = `${data.weather[0].description} / ${data.main.temp.toFixed(1)}°C`);
    });
  }

(async function(){
 // --- 날짜 (요일 길게: "월요일") ---
  const today = new Date();
  document.getElementById("date").textContent = today.toLocaleDateString('ko-KR', {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    weekday: 'long'
  });

   // --- 서울 고정 좌표 (위도, 경도) ---
  const lat = 37.5665;
  const lon = 126.9780;

  // --- Open-Meteo 현재날씨 API (키 불필요, CORS 허용) ---
  const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=Asia/Seoul`;

  // 날씨코드 → (아이콘, 한글설명) 매핑
  const weatherMap = {
    0:  {icon:'☀️',  desc:'맑음'},
    1:  {icon:'🌤️', desc:'주로 맑음'},
    2:  {icon:'⛅',  desc:'부분적으로 흐림'},
    3:  {icon:'☁️',  desc:'흐림'},
    45: {icon:'🌫️', desc:'안개'},
    48: {icon:'🌫️', desc:'서리 안개'},
    51: {icon:'🌦️', desc:'약한 이슬비'},
    53: {icon:'🌦️', desc:'보통 이슬비'},
    55: {icon:'🌧️', desc:'강한 이슬비'},
    56: {icon:'🌧️', desc:'약한 얼음비'},
    57: {icon:'🌧️', desc:'강한 얼음비'},
    61: {icon:'🌧️', desc:'약한 비'},
    63: {icon:'🌧️', desc:'보통 비'},
    65: {icon:'🌧️', desc:'강한 비'},
    66: {icon:'🌨️', desc:'약한 진눈깨비'},
    67: {icon:'🌨️', desc:'강한 진눈깨비'},
    71: {icon:'🌨️', desc:'약한 눈'},
    73: {icon:'🌨️', desc:'보통 눈'},
    75: {icon:'❄️',  desc:'강한 눈'},
    77: {icon:'❄️',  desc:'눈알(눈 입자)'},
    80: {icon:'🌧️', desc:'약한 소나기'},
    81: {icon:'🌧️', desc:'소나기'},
    82: {icon:'⛈️', desc:'강한 소나기'},
    85: {icon:'🌨️', desc:'약한 눈 소나기'},
    86: {icon:'❄️',  desc:'강한 눈 소나기'},
    95: {icon:'⛈️', desc:'뇌우(천둥번개)'},
    96: {icon:'⛈️', desc:'우박을 동반한 뇌우'},
    99: {icon:'⛈️', desc:'강한 우박을 동반한 뇌우'}
  };

  const weatherDescEl = document.getElementById("weather-desc");

  // 로딩 표시
  weatherDescEl.textContent = "날씨 불러오는 중...";

  try {
    const res = await fetch(apiUrl, { cache: "no-cache" });
    if (!res.ok) throw new Error('응답오류: ' + res.status);
    const data = await res.json();

    if (!data.current_weather) {
      weatherDescEl.textContent = "날씨 데이터를 받을 수 없습니다.";
      weatherTempEl.textContent = "";
      return;
    }

    const code = data.current_weather.weathercode;
    const temp = data.current_weather.temperature; // 섭씨
    const wind = data.current_weather.windspeed;

    const info = weatherMap.hasOwnProperty(code) ? weatherMap[code] : {icon:'❔', desc:'알 수 없음'};

    weatherDescEl.textContent = `${info.icon} ${info.desc} ${temp.toFixed(1)}°C · 바람 ${Math.round(wind)}km/h`;
    
  } catch (err) {
    console.error(err);
    weatherDescEl.textContent = "날씨 정보를 불러올 수 없습니다.";
    weatherTempEl.textContent = "";
  }
})();
</script>
</body>
</html>
